[workspace]
name = "agent-mesh"
version = "0.1.0"
description = "Decentralized Agent P2P mesh and DeepSeek Harness plugins"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
requires-pixi = ">=0.59,<0.60"

[dependencies]
rust = ">=1.85,<2"
nodejs = "24.*"
pnpm = "==11.7.0"
git = ">=2.26"
ripgrep = "*"
jq = "*"
rattler-build = "==0.75.0"
rust-std-aarch64-apple-ios = "1.98.*"
rust-std-aarch64-apple-ios-sim = "1.98.*"

[tasks]
bootstrap = "pnpm install --frozen-lockfile"
bootstrap-update = "pnpm install"
build-rust = "cargo build --workspace --release"
build-rust-debug = "cargo build --workspace"
build-plugins = "pnpm -r --if-present build"
build = { depends-on = ["build-rust", "build-plugins"] }
test-rust = "cargo test --workspace"
test-plugins = "pnpm -r --if-present test"
test-tooling = "node --test tooling/*.test.js"
test-integration = { cmd = "bash scripts/smoke-two-nodes.sh target/debug/agent-mesh", depends-on = ["build-rust-debug"] }
test = { depends-on = ["test-rust", "test-plugins", "test-tooling", "test-integration"] }
fmt-check = "cargo fmt --all --check"
clippy = "cargo clippy --workspace --all-targets -- -D warnings"
check = { depends-on = ["fmt-check", "clippy", "test", "build-plugins"] }
pack = "node tooling/pack-plugins.mjs"
test-packed = { cmd = "node tooling/test-packed-profile.mjs", depends-on = ["pack"] }
harness-install = "node tooling/harness-profile.mjs install"
harness-dump = "node tooling/harness-profile.mjs dump"
harness-web = "node tooling/harness-profile.mjs web"
dsh-mesh = "node tooling/dsh-mesh.mjs"
package-conda = "rattler-build build --recipe packaging/conda --output-dir artifacts/conda"
ios-rust = "bash scripts/build-ios-rust.sh"
ios-build-sim = { cmd = "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild -project apps/ios/DeepseekAgentMesh.xcodeproj -scheme DeepseekAgentMesh -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build", depends-on = ["ios-rust"] }
